$kind: http-request
description: Create a customer.
url: "{{baseUrl}}/customers"
method: POST
headers:
  Content-Type: application/json
  Accept: application/json
body:
  type: json
  content: '{"name":"Acme Bakery","email":"owner@acmebakery.test"}'
settings: {}
examples: ./.resources/Create customer.resources/examples
order: 1000
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 201", () => pm.response.to.have.status(201));
      pm.test("Response has customer fields", () => {
        const body = pm.response.json();
        pm.expect(body).to.have.property("id");
        pm.expect(body).to.have.property("name");
        pm.expect(body).to.have.property("email");
        pm.expect(body).to.have.property("createdAt");
      });
      const id = pm.response.json().id;
      if (id) pm.collectionVariables.set("customerId", id);
