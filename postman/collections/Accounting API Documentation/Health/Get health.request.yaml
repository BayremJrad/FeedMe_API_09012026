$kind: http-request
description: |-
  Returns the current health status of the Accounting API service.

  **Method:** `GET`  
  **URL:** `{{baseUrl}}/health`

  ## Response

  | Field | Type | Description |
  |-------|------|-------------|
  | `status` | string | Current service status (e.g. `"ok"`) |
  | `service` | string | Name of the service |

  **Success status:** `200 OK`

  ## Tests
  - Verifies response status is `200`
  - Verifies response body contains `status` and `service` fields
url: "{{baseUrl}}/health"
method: GET
headers:
  Accept: application/json
settings: {}
examples: ./.resources/Get health.resources/examples
order: 1000
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 200", () => pm.response.to.have.status(200));
      pm.test("Response has status and service fields", () => {
        const body = pm.response.json();
        pm.expect(body).to.have.property("status");
        pm.expect(body).to.have.property("service");
      });
