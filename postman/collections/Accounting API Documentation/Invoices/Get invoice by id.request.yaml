$kind: http-request
description: |-
  Retrieves the full details of a specific invoice by its unique ID.

  **Method:** `GET`  
  **URL:** `{{baseUrl}}/invoices/:invoiceId`

  ## Path Variables

  | Variable | Description |
  |----------|-------------|
  | `invoiceId` | The unique ID of the invoice to retrieve. Defaults to `{{invoiceId}}` collection variable. |

  ## Response

  | Field | Type | Description |
  |-------|------|-------------|
  | `id` | string | Unique invoice identifier |
  | `invoiceNumber` | string | Human-readable invoice number |
  | `customerId` | string | Associated customer ID |
  | `lineItems` | array | List of line items on the invoice |
  | `total` | number | Total invoice amount |
  | `status` | string | Invoice status (e.g. `"draft"`, `"sent"`, `"paid"`) |

  **Success status:** `200 OK`

  ## Tests
  - Verifies response status is `200`
  - Verifies response body contains `id`, `invoiceNumber`, `customerId`, `lineItems`, `total`, and `status` fields
url: "{{baseUrl}}/invoices/:invoiceId"
method: GET
headers:
  Accept: application/json
pathVariables:
  invoiceId: '{{invoiceId}}'
settings: {}
examples: ./.resources/Get invoice by id.resources/examples
order: 2000
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 200", () => pm.response.to.have.status(200));
      pm.test("Response has full invoice fields", () => {
        const body = pm.response.json();
        pm.expect(body).to.have.property("id");
        pm.expect(body).to.have.property("invoiceNumber");
        pm.expect(body).to.have.property("customerId");
        pm.expect(body).to.have.property("lineItems");
        pm.expect(body).to.have.property("total");
        pm.expect(body).to.have.property("status");
      });
