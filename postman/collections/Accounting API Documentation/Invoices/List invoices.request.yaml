$kind: http-request
description: |-
  Retrieves a list of all invoices in the accounting system.

  **Method:** `GET`  
  **URL:** `{{baseUrl}}/invoices`

  ## Response

  Returns a JSON array of invoice objects. Each object contains:

  | Field | Type | Description |
  |-------|------|-------------|
  | `id` | string | Unique invoice identifier |
  | `invoiceNumber` | string | Human-readable invoice number |
  | `customerId` | string | Associated customer ID |
  | `status` | string | Invoice status (e.g. `"draft"`, `"sent"`, `"paid"`) |
  | `total` | number | Total invoice amount |
  | `dueDate` | string | Payment due date |

  **Success status:** `200 OK`

  ## Tests
  - Verifies response status is `200`
  - Verifies response body is an array
url: "{{baseUrl}}/invoices"
method: GET
headers:
  Accept: application/json
settings: {}
examples: ./.resources/List invoices.resources/examples
order: 4000
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 200", () => pm.response.to.have.status(200));
      pm.test("Response is an array", () => {
        pm.expect(pm.response.json()).to.be.an("array");
      });
