$kind: http-example
request:
  url: "{{baseUrl}}/invoices/:invoiceId/payments"
  method: POST
  headers:
    Content-Type: application/json
    Accept: application/json
  pathVariables:
    - key: invoiceId
      value: inv_1001
      description: Invoice ID
  body:
    type: json
    content: ""
response:
  statusCode: 201
  statusText: Created
  headers:
    Content-Type: application/json
    Accept: application/json
  body:
    type: json
    content: |-
      {
        "id": "pay_9001",
        "invoiceId": "inv_1001",
        "amount": 500,
        "currency": "USD",
        "paymentDate": "2026-01-20",
        "method": "bank_transfer",
        "reference": "BT-7781"
      }
order: 1000
