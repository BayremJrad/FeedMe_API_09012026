$kind: http-request
description: |-
  Retrieves a list of all customers registered in the accounting system.

  **Method:** `GET`  
  **URL:** `{{baseUrl}}/customers`

  ## Response

  Returns a JSON array of customer objects. Each object contains:

  | Field | Type | Description |
  |-------|------|-------------|
  | `id` | string | Unique customer identifier |
  | `name` | string | Customer name |
  | `email` | string | Customer email |
  | `createdAt` | string | ISO 8601 creation timestamp |

  **Success status:** `200 OK`

  ## Tests
  - Verifies response status is `200`
  - Verifies response body is an array
url: "{{baseUrl}}/customers"
method: GET
headers:
  Accept: application/json
settings: {}
examples: ./.resources/List customers.resources/examples
order: 2000
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 200", () => pm.response.to.have.status(200));
      pm.test("Response is an array", () => {
        pm.expect(pm.response.json()).to.be.an("array");
      });
